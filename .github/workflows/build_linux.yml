name: 'Build: Linux / Check: Unit tests (mtests)'

on:
  schedule: # scheduled workflows will only run on the default branch. edit default values under gen1 below
    - cron: '0 4 */1 * *' # At 04:00 on every day-of-month
  push: # push.inputs field does not exist, use gen1 below
    branches:
    - 3.x
  pull_request: # all branches. pull_request.inputs field does not exist, edit gen1 below
  workflow_dispatch: # triggered by github web ui run "build linux" workflow button
    inputs:
      platforms:
        description: 'Platforms to build:'
        default: 'linux_x64 linux_armhf linux_arm64'
        type: string
        required: true
      build_mode:
        description: 'Build mode: devel, nightly, testing, stable'
        default: 'devel'
        type: string
        required: true
      runtest:
        description: 'Check: Unit tests (mtests)'
        default: 'on'
        type: string
        required: false
      mtestuploadpath:
        description: 'Upload mtest generated eg ./build.debug/mtest/libmscore/midi (empty to disable)'
        default: ''
        type: string
        required: false
      publish:
        description: 'Publish to FTP when nightly generated (obsolete): on, off'
        default: 'off'
        type: string
        required: false
      execfrompubdev:
        description: 'workflow github.event_name workaround, leave as is'
        default: 'false'
        type: string
        required: true
  workflow_call: # triggered by "uses" from other yml files. copy paste of workflow_dispatch for simplicity. "default" fields ignored (unsure)
    inputs:
      platforms:
        description: 'Platforms to build:'
        default: 'linux_x64 linux_armhf linux_arm64'
        type: string
        required: true
      build_mode:
        description: 'Build mode: devel, nightly, testing, stable'
        default: 'devel'
        type: string
        required: true
      runtest:
        description: 'Check: Unit tests (mtests)'
        default: 'on'
        type: string
        required: false
      mtestuploadpath:
        description: 'Upload mtest generated eg ./build.debug/mtest/libmscore/midi (empty to disable)'
        default: ''
        type: string
        required: false
      publish:
        description: 'Publish to FTP when nightly generated (obsolete): on, off'
        default: 'off'
        type: string
        required: false
      execfrompubdev:
        description: 'workflow github.event_name workaround, leave as is'
        default: 'false'
        type: string
        required: true

jobs:
  # debugbefore:
  #   name: debug before (linux yml)
  #   runs-on: ubuntu-latest
  #   steps:
  #   - name: debug before # ${{ inputs.platforms }} empty on push
  #     run: |
  #       echo "github.event_name=${{github.event_name}}"
  #       echo "inputs.platforms=${{ inputs.platforms }}"
  #       echo "inputs.execfrompubdev=${{ inputs.execfrompubdev }}"

  plan:
    name: Generate default values (linux yml)
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.gen1.outputs.platforms }}
      build_mode: ${{ steps.gen1.outputs.build_mode }}
      runtest: ${{ steps.gen1.outputs.runtest }}
      mtestuploadpath: ${{ steps.gen1.outputs.mtestuploadpath }}
      publish: ${{ steps.gen1.outputs.publish }}
    steps:
    - id: gen1
      name: Set or pass values
      run: |
        if [[ "${{ inputs.execfrompubdev }}" == "true" ]]; then

          echo "triggered by on.push/pull_request/schedule of publishdev , on.workflow_call of build linux"

          echo "platforms=${{ inputs.platforms }}" | tee -a "$GITHUB_OUTPUT"
          echo "build_mode=${{ inputs.build_mode }}" | tee -a "$GITHUB_OUTPUT"
          echo "runtest=${{ inputs.runtest }}" | tee -a "$GITHUB_OUTPUT"
          echo "mtestuploadpath=${{ inputs.mtestuploadpath }}" | tee -a "$GITHUB_OUTPUT"
          echo "publish=${{ inputs.publish }}" | tee -a "$GITHUB_OUTPUT"

        elif [[ "${{ github.event_name }}" == "pull_request" ]];  then

          echo "triggered by 1. on.pull_request of build linux or 2. on.pull_request of workflows other than publishdev that triggers on.workflow_call of build linux"

          echo "platforms=linux_x64 linux_armhf linux_arm64" | tee -a "$GITHUB_OUTPUT"
          echo "build_mode=devel" | tee -a "$GITHUB_OUTPUT"  # copy from make_build_mode_env.sh
          echo "runtest=on" | tee -a "$GITHUB_OUTPUT"
          echo "mtestuploadpath=''" | tee -a "$GITHUB_OUTPUT"
          echo "publish=off" | tee -a "$GITHUB_OUTPUT"

        elif [[ "${{ github.event_name }}" == "schedule" ]];  then

          echo "triggered by 1. on.schedule of build linux or 2. on.schedule of workflows other than publishdev that triggers on.workflow_call of build linux"
          
          echo "platforms=linux_x64 linux_armhf linux_arm64" | tee -a "$GITHUB_OUTPUT"
          echo "build_mode=nightly" | tee -a "$GITHUB_OUTPUT"  # copy from make_build_mode_env.sh
          echo "runtest=on" | tee -a "$GITHUB_OUTPUT"
          echo "mtestuploadpath=''" | tee -a "$GITHUB_OUTPUT"
          echo "publish=off" | tee -a "$GITHUB_OUTPUT"

        elif [[ "${{ github.event_name }}" == "push" ]]; then

          echo "triggered 1. by on.push of build linux or 2. on.push of workflows other than publishdev that triggers on.workflow_call of build linux"

          echo "platforms=linux_x64 linux_armhf linux_arm64" | tee -a "$GITHUB_OUTPUT"
          echo "build_mode=devel" | tee -a "$GITHUB_OUTPUT"  # copy from make_build_mode_env.sh
          echo "runtest=on" | tee -a "$GITHUB_OUTPUT"
          echo "mtestuploadpath=''" | tee -a "$GITHUB_OUTPUT"
          echo "publish=off" | tee -a "$GITHUB_OUTPUT"

        else

          echo "platforms=${{ inputs.platforms }}" | tee -a "$GITHUB_OUTPUT"
          echo "build_mode=${{ inputs.build_mode }}" | tee -a "$GITHUB_OUTPUT"
          echo "runtest=${{ inputs.runtest }}" | tee -a "$GITHUB_OUTPUT"
          echo "mtestuploadpath=${{ inputs.mtestuploadpath }}" | tee -a "$GITHUB_OUTPUT"
          echo "publish=${{ inputs.publish }}" | tee -a "$GITHUB_OUTPUT"

        fi

  # debugafter:
  #   name: debug after (linux yml)
  #   needs:
  #     - plan
  #   runs-on: ubuntu-latest
  #   steps:
  #   - name: debug after # confirm use "needs.plan.outputs." in replace of "inputs."
  #     run: |
  #       echo "needs.plan.outputs.platforms=${{ needs.plan.outputs.platforms }}"

# linux_x64, linux_armhf and linux_arm64 are identical copies, except for "if", "runs-on" and, "env.ARCH" fields. Separation at workflow job level for easier push/schedule default platform management.

  linux_x64:
    if: ${{ contains(needs.plan.outputs.platforms, 'linux_x64') }}
    runs-on: ubuntu-22.04
    env:
      ARCH: x86_64
    ##
    needs:
      - plan
    steps:
    - name: Cancel Previous Runs
      uses: styfle/cancel-workflow-action@0.12.1
      with:
        access_token: ${{ github.token }}
    - name: Clone repository
      uses: actions/checkout@v4
    - name: setup QEMU
      if: env.ARCH == 'armv7l' || env.ARCH == 'aarch64'
      uses: docker/setup-qemu-action@v2
    - name: Configure workflow
      run: |
        bash ./build/ci/tools/make_build_mode_env.sh -e ${{ github.event_name }} -m ${{ needs.plan.outputs.build_mode }}
        BUILD_MODE=$(cat ./build.artifacts/env/build_mode.env)

        bash ./build/ci/tools/make_build_number.sh
        BUILD_NUMBER=$(cat ./build.artifacts/env/build_number.env)

        DO_PUBLISH='false'
        if [[ "${{ needs.plan.outputs.publish }}" == "on" && "$BUILD_MODE" == "nightly" ]]; then
          DO_PUBLISH='true'
          if [ -z "${{ secrets.OSUOSL_SSH_ENCRYPT_SECRET }}" ]; then
            echo "::warning::OSUOSL_SSH_ENCRYPT_SECRET is empty; not publishing to OSUOSL"
            DO_PUBLISH='false'
          fi
        fi

        ADD_INFO="_${GITHUB_REF#refs/heads/}"
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          ADD_INFO="_${{ github.event.pull_request.number }}_${{ github.event.pull_request.title }}"
        fi
        UPLOAD_ARTIFACT_NAME="$(tr '":<>|*?/\\’' '_' <<<"Mu3.7_${BUILD_NUMBER}_Lin_$ARCH${ADD_INFO}")"

        echo "github.repository: ${{ github.repository }}"
        echo "BUILD_MODE=$BUILD_MODE" | tee -a $GITHUB_ENV
        echo "BUILD_NUMBER=$BUILD_NUMBER" | tee -a $GITHUB_ENV
        echo "DO_PUBLISH=$DO_PUBLISH" | tee -a $GITHUB_ENV
        echo "UPLOAD_ARTIFACT_NAME=$UPLOAD_ARTIFACT_NAME" | tee -a $GITHUB_ENV
    - name: Setup, Generate, Update, Build the AppImage
      if: env.ARCH == 'x86_64'
      run: |
        T_ID=${{ secrets.TELEMETRY_TRACK_ID }}; if [ -z "$T_ID" ]; then T_ID="''"; fi
        sudo bash ./build/ci/linux/setup.sh --arch $ARCH 
        sudo bash ./build/ci/linux/build.sh -n ${{ github.run_id }} --telemetry $T_ID  
        sudo bash ./build/ci/linux/package.sh --arch $ARCH 
        sudo bash ./build/ci/tools/checksum.sh
    - name: Setup, Generate, Update, Build the AppImage (ARM)
      if: env.ARCH == 'armv7l' || env.ARCH == 'aarch64'
      run: |
        if [[ "$ARCH" == "armv7l" ]]; then DOCKERIMAGE="arm32v7"; fi
        if [[ "$ARCH" == "aarch64" ]]; then DOCKERIMAGE="arm64v8"; fi
        T_ID=${{ secrets.TELEMETRY_TRACK_ID }}; if [ -z "$T_ID" ]; then T_ID="''"; fi
        sudo docker run -i -v "${PWD}:/MuseScore" "$DOCKERIMAGE/ubuntu:focal" /bin/bash -c "cd /MuseScore && \
        bash /MuseScore/build/ci/linux/setup.sh --arch $ARCH && \
        bash /MuseScore/build/ci/linux/build.sh -n ${{ github.run_id }} --telemetry $T_ID  && \
        bash /MuseScore/build/ci/linux/package.sh --arch $ARCH && \
        bash /MuseScore/build/ci/tools/checksum.sh"
    - name: Publish to OSUOSL
      if: env.DO_PUBLISH == 'true'
      run: |
        bash ./build/ci/tools/osuosl/publish.sh -s ${{ secrets.OSUOSL_SSH_ENCRYPT_SECRET }} --os linux -v 3
    - name: Upload artifacts on GitHub
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.UPLOAD_ARTIFACT_NAME }}
        path: ./build.artifacts/

  linux_armhf:
    if: ${{ contains(needs.plan.outputs.platforms, 'linux_armhf') }}
    runs-on: ubuntu-22.04-arm
    env:
      ARCH: armv7l
    ##
    needs:
      - plan
    steps:
    - name: Cancel Previous Runs
      uses: styfle/cancel-workflow-action@0.12.1
      with:
        access_token: ${{ github.token }}
    - name: Clone repository
      uses: actions/checkout@v4
    - name: setup QEMU
      if: env.ARCH == 'armv7l' || env.ARCH == 'aarch64'
      uses: docker/setup-qemu-action@v2
    - name: Configure workflow
      run: |
        bash ./build/ci/tools/make_build_mode_env.sh -e ${{ github.event_name }} -m ${{ needs.plan.outputs.build_mode }}
        BUILD_MODE=$(cat ./build.artifacts/env/build_mode.env)

        bash ./build/ci/tools/make_build_number.sh
        BUILD_NUMBER=$(cat ./build.artifacts/env/build_number.env)

        DO_PUBLISH='false'
        if [[ "${{ needs.plan.outputs.publish }}" == "on" && "$BUILD_MODE" == "nightly" ]]; then
          DO_PUBLISH='true'
          if [ -z "${{ secrets.OSUOSL_SSH_ENCRYPT_SECRET }}" ]; then
            echo "::warning::OSUOSL_SSH_ENCRYPT_SECRET is empty; not publishing to OSUOSL"
            DO_PUBLISH='false'
          fi
        fi

        ADD_INFO="_${GITHUB_REF#refs/heads/}"
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          ADD_INFO="_${{ github.event.pull_request.number }}_${{ github.event.pull_request.title }}"
        fi
        UPLOAD_ARTIFACT_NAME="$(tr '":<>|*?/\\’' '_' <<<"Mu3.7_${BUILD_NUMBER}_Lin_$ARCH${ADD_INFO}")"

        echo "github.repository: ${{ github.repository }}"
        echo "BUILD_MODE=$BUILD_MODE" | tee -a $GITHUB_ENV
        echo "BUILD_NUMBER=$BUILD_NUMBER" | tee -a $GITHUB_ENV
        echo "DO_PUBLISH=$DO_PUBLISH" | tee -a $GITHUB_ENV
        echo "UPLOAD_ARTIFACT_NAME=$UPLOAD_ARTIFACT_NAME" | tee -a $GITHUB_ENV
    - name: Setup, Generate, Update, Build the AppImage
      if: env.ARCH == 'x86_64'
      run: |
        T_ID=${{ secrets.TELEMETRY_TRACK_ID }}; if [ -z "$T_ID" ]; then T_ID="''"; fi
        sudo bash ./build/ci/linux/setup.sh --arch $ARCH 
        sudo bash ./build/ci/linux/build.sh -n ${{ github.run_id }} --telemetry $T_ID  
        sudo bash ./build/ci/linux/package.sh --arch $ARCH 
        sudo bash ./build/ci/tools/checksum.sh
    - name: Setup, Generate, Update, Build the AppImage (ARM)
      if: env.ARCH == 'armv7l' || env.ARCH == 'aarch64'
      run: |
        if [[ "$ARCH" == "armv7l" ]]; then DOCKERIMAGE="arm32v7"; fi
        if [[ "$ARCH" == "aarch64" ]]; then DOCKERIMAGE="arm64v8"; fi
        T_ID=${{ secrets.TELEMETRY_TRACK_ID }}; if [ -z "$T_ID" ]; then T_ID="''"; fi
        sudo docker run -i -v "${PWD}:/MuseScore" "$DOCKERIMAGE/ubuntu:focal" /bin/bash -c "cd /MuseScore && \
        bash /MuseScore/build/ci/linux/setup.sh --arch $ARCH && \
        bash /MuseScore/build/ci/linux/build.sh -n ${{ github.run_id }} --telemetry $T_ID  && \
        bash /MuseScore/build/ci/linux/package.sh --arch $ARCH && \
        bash /MuseScore/build/ci/tools/checksum.sh"
    - name: Publish to OSUOSL
      if: env.DO_PUBLISH == 'true'
      run: |
        bash ./build/ci/tools/osuosl/publish.sh -s ${{ secrets.OSUOSL_SSH_ENCRYPT_SECRET }} --os linux -v 3
    - name: Upload artifacts on GitHub
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.UPLOAD_ARTIFACT_NAME }}
        path: ./build.artifacts/

  linux_arm64:
    if: ${{ contains(needs.plan.outputs.platforms, 'linux_arm64') }}
    runs-on: ubuntu-22.04-arm
    env:
      ARCH: aarch64
    ##
    needs:
      - plan
    steps:
    - name: Cancel Previous Runs
      uses: styfle/cancel-workflow-action@0.12.1
      with:
        access_token: ${{ github.token }}
    - name: Clone repository
      uses: actions/checkout@v4
    - name: setup QEMU
      if: env.ARCH == 'armv7l' || env.ARCH == 'aarch64'
      uses: docker/setup-qemu-action@v2
    - name: Configure workflow
      run: |
        bash ./build/ci/tools/make_build_mode_env.sh -e ${{ github.event_name }} -m ${{ needs.plan.outputs.build_mode }}
        BUILD_MODE=$(cat ./build.artifacts/env/build_mode.env)

        bash ./build/ci/tools/make_build_number.sh
        BUILD_NUMBER=$(cat ./build.artifacts/env/build_number.env)

        DO_PUBLISH='false'
        if [[ "${{ needs.plan.outputs.publish }}" == "on" && "$BUILD_MODE" == "nightly" ]]; then
          DO_PUBLISH='true'
          if [ -z "${{ secrets.OSUOSL_SSH_ENCRYPT_SECRET }}" ]; then
            echo "::warning::OSUOSL_SSH_ENCRYPT_SECRET is empty; not publishing to OSUOSL"
            DO_PUBLISH='false'
          fi
        fi

        ADD_INFO="_${GITHUB_REF#refs/heads/}"
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          ADD_INFO="_${{ github.event.pull_request.number }}_${{ github.event.pull_request.title }}"
        fi
        UPLOAD_ARTIFACT_NAME="$(tr '":<>|*?/\\’' '_' <<<"Mu3.7_${BUILD_NUMBER}_Lin_$ARCH${ADD_INFO}")"

        echo "github.repository: ${{ github.repository }}"
        echo "BUILD_MODE=$BUILD_MODE" | tee -a $GITHUB_ENV
        echo "BUILD_NUMBER=$BUILD_NUMBER" | tee -a $GITHUB_ENV
        echo "DO_PUBLISH=$DO_PUBLISH" | tee -a $GITHUB_ENV
        echo "UPLOAD_ARTIFACT_NAME=$UPLOAD_ARTIFACT_NAME" | tee -a $GITHUB_ENV
    - name: Setup, Generate, Update, Build the AppImage
      if: env.ARCH == 'x86_64'
      run: |
        T_ID=${{ secrets.TELEMETRY_TRACK_ID }}; if [ -z "$T_ID" ]; then T_ID="''"; fi
        sudo bash ./build/ci/linux/setup.sh --arch $ARCH 
        sudo bash ./build/ci/linux/build.sh -n ${{ github.run_id }} --telemetry $T_ID  
        sudo bash ./build/ci/linux/package.sh --arch $ARCH 
        sudo bash ./build/ci/tools/checksum.sh
    - name: Setup, Generate, Update, Build the AppImage (ARM)
      if: env.ARCH == 'armv7l' || env.ARCH == 'aarch64'
      run: |
        if [[ "$ARCH" == "armv7l" ]]; then DOCKERIMAGE="arm32v7"; fi
        if [[ "$ARCH" == "aarch64" ]]; then DOCKERIMAGE="arm64v8"; fi
        T_ID=${{ secrets.TELEMETRY_TRACK_ID }}; if [ -z "$T_ID" ]; then T_ID="''"; fi
        sudo docker run -i -v "${PWD}:/MuseScore" "$DOCKERIMAGE/ubuntu:focal" /bin/bash -c "cd /MuseScore && \
        bash /MuseScore/build/ci/linux/setup.sh --arch $ARCH && \
        bash /MuseScore/build/ci/linux/build.sh -n ${{ github.run_id }} --telemetry $T_ID  && \
        bash /MuseScore/build/ci/linux/package.sh --arch $ARCH && \
        bash /MuseScore/build/ci/tools/checksum.sh"
    - name: Publish to OSUOSL
      if: env.DO_PUBLISH == 'true'
      run: |
        bash ./build/ci/tools/osuosl/publish.sh -s ${{ secrets.OSUOSL_SSH_ENCRYPT_SECRET }} --os linux -v 3
    - name: Upload artifacts on GitHub
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.UPLOAD_ARTIFACT_NAME }}
        path: ./build.artifacts/

  run_mtests:
    if: needs.plan.outputs.runtest == 'on'
    needs:
      - plan
    runs-on: ubuntu-22.04
    env:
        # Enable AddressSanitizer in the mtest build
        CFLAGS: "-fsanitize=address -fno-omit-frame-pointer"
        CXXFLAGS: "-fsanitize=address -fno-omit-frame-pointer"
    steps:
    - name: Clone repository
      uses: actions/checkout@v4
    - name: Free disk space
      run: |
        sudo docker system prune -a -f
        sudo rm -rf /usr/local/lib/android
    - name: Setup environment
      run: |
        sudo bash ./build/ci/linux/setup.sh
    - name: Build
      run: |
        mkdir -p build.artifacts/env
        ./build/ci/linux/build.sh -n ${{ github.run_id }} --build_mode mtests
    - name: Run mtests
      run: |
        ./build/ci/linux/runmtests.sh

  mtestupload:
    if: needs.plan.outputs.runtest == 'on' && needs.plan.outputs.mtestuploadpath != ''
    steps:
    - name: Upload artifacts on GitHub
      uses: actions/upload-artifact@v4
      with:
        name: mtestref
        path: ${{needs.plan.outputs.mtestuploadpath}}