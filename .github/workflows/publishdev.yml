name: Build and draft release

on:
  push:
    branches:
    - temp21
    inputs:
      manual_name:
        description: 'Release name:'
        default: 'default'
        type: string
        required: true
      manual_tag:
        description: 'Release tag:'
        default: 'default'
        type: string
        required: true
      platforms:
        description: 'Platforms to build:'
        default: 'linux_x64 macos_intel macos_apple windows_x64 windows_x32 windows_x32_portable windows_x64_portable'
        type: string
        required: true
      build_mode:
        description: 'Build mode: devel, nightly, testing, stable'
        default: 'devel'
        type: string
        required: true
      runtest:
        description: 'Check: Unit tests (mtests)'
        default: 'off'
        type: string
        required: true
      publish:
        description: 'Publish to FTP: on - publish'
        default: 'off'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      manual_name:
        description: 'Release name:'
        default: 'default'
        type: string
        required: true
      manual_tag:
        description: 'Release tag:'
        default: 'default'
        type: string
        required: true
      platforms:
        description: 'Platforms to build:'
        default: 'linux_x64 macos_intel macos_apple windows_x64 windows_x32 windows_x32_portable windows_x64_portable'
        type: string
        required: true
      build_mode:
        description: 'Build mode: devel, nightly, testing, stable'
        default: 'devel'
        type: string
        required: true
      runtest:
        description: 'Check: Unit tests (mtests)'
        default: 'off'
        type: string
        required: true
      publish:
        description: 'Publish to FTP: on - publish'
        default: 'off'
        type: string
        required: true


defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Generate strings
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.gen1.outputs.platforms }}
      build_mode: ${{ steps.gen1.outputs.build_mode }}
      runtest: ${{ steps.gen1.outputs.runtest }}
      publish: ${{ steps.gen1.outputs.publish }}
      release_name: ${{ steps.gen2.outputs.release_name }}
      release_tag: ${{ steps.gen2.outputs.release_tag }}
    steps:
    - name: Clone repo
      uses: actions/checkout@v4
      # with:
      #   fetch-depth: 0 # entire history for all branches and tags
    - id: gen1
      name: github workflow on push inputs empty bug workaround # ${{ inputs.platforms }} empty on push bug
      run: |
        echo "inputs.platforms=${{ inputs.platforms }}"
        echo "github.event_name=${{github.event_name}}"

        if [[ "${{ github.event_name }}" == "push" ]]; then
          echo "platforms='linux_x64 macos_intel macos_apple windows_x64 windows_x32 windows_x32_portable windows_x64_portable'" >> "$GITHUB_OUTPUT"
          echo "build_mode='devel'" >> "$GITHUB_OUTPUT"
          echo "runtest='off'" >> "$GITHUB_OUTPUT"
          echo "publish='off'" >> "$GITHUB_OUTPUT"
        else
          echo "platforms=${{ inputs.platforms }}" >> "$GITHUB_OUTPUT"
          echo "build_mode=${{ inputs.build_mode }}" >> "$GITHUB_OUTPUT"
          echo "runtest=${{ inputs.runtest }}" >> "$GITHUB_OUTPUT"
          echo "publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
        fi
    - id: gen2
      name: Generate name and tag
      run: |
        if [[ "${{ inputs.manual_name }}" != "default" ]]; then
          echo "release_name=${{ inputs.manual_name }}" >> "$GITHUB_OUTPUT"
        else
          echo "release_name=$(git log -1 --format=%cd --date=format:%Y%m%d)" >> "$GITHUB_OUTPUT"
        fi
        if [[ "${{ inputs.manual_tag }}" != "default" ]]; then
          echo "release_tag=${{ inputs.manual_tag }}" >> "$GITHUB_OUTPUT"
        else
          echo "release_tag=$(git log -1 --format=%cd --date=format:%Y%m%d)" >> "$GITHUB_OUTPUT"
        fi
        

  build:
    name: Build
    needs:
      - plan
    uses: ./.github/workflows/build_all.yml
    secrets: inherit
    with:
      platforms: ${{ needs.plan.outputs.platforms }}  # ${{ inputs.platforms }} empty on push bug
      build_mode: ${{ needs.plan.outputs.build_mode }}
      runtest: ${{ needs.plan.outputs.runtest }}
      publish: ${{ needs.plan.outputs.publish }}

  create_release:
    name: Create release
    needs:
      - plan
      - build
    if: ${{ ! failure() && ! cancelled() }} # ? meaning of original comment from master ? >> run even if prior jobs were skipped
    runs-on: ubuntu-latest
    environment:
      name: devpublish
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.plan.outputs.release_tag }}
    steps:
    - name: Clone repository
      uses: actions/checkout@v4
    - name: Download and extract artifacts
      uses: actions/download-artifact@v4
      with:
        path: build.artifacts
    - name: Collate release binaries
      run: |
        build/ci/release/collate_release_binaries.sh
    - name: Create tag
      env:
        TAG_NAME: ${{ needs.plan.outputs.release_tag }}
      run: |
        git tag "${TAG_NAME}" "${GITHUB_SHA}"
        git push origin "${TAG_NAME}"
    - name: Create draft release
      uses: softprops/action-gh-release@v2
      with: # https://github.com/softprops/action-gh-release?tab=readme-ov-file#inputs
        draft: true
        files: release/*
        name: ${{ needs.plan.outputs.release_name }}
        tag_name: ${{ needs.plan.outputs.release_tag }}
        fail_on_unmatched_files: true
        generate_release_notes: false